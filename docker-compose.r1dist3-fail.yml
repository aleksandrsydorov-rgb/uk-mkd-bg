services:
  amadeus11-app:
    image: amadeus11-app:1.0.0-rc2
    container_name: amadeus11-app-r1dist3-fail
    ports:
      - '3083:3000'
    env_file:
      - .env.docker.r1dist3-fail
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: 'no'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 5s
