services:
  amadeus11-app:
    image: amadeus11-app:1.0.0-rc1
    container_name: amadeus11-app-r1dist3-rollback
    ports:
      - '3084:3000'
    env_file:
      - .env.docker.r1dist3-rollback
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
