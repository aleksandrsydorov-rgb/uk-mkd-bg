# AMADEUS 11 — local Docker Release Candidate (app only).
# Supabase remains external: point at isolated local stack (amadeus11-is10a-local).
# Never targets cloud. No migrations on container boot.

services:
  amadeus11-app:
    image: amadeus11-app:1.0.0-rc1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser-visible origin (host machine). Rebuild image when these change.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY is required}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3080}
    container_name: amadeus11-app-r1dist1-rc
    restart: unless-stopped
    ports:
      - "${AMADEUS_HOST_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Server-side reachability to host-published local Supabase (Windows/macOS Docker Desktop).
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:54321}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://127.0.0.1:3080}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-false}
      EMAIL_WORKER_SECRET: ${EMAIL_WORKER_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
